# 正式環境（單台 AWS Lightsail，與 Bookdex 預約簿同一台主機，前面是 Cloudflare），說明見 deploy/lightsail/README.md。
# 在主機的 /opt/bigtours 由 deploy/lightsail/deploy.sh 啟動；密碼與金鑰都在主機的 .env，沒填就無法啟動。
# 與 docker-compose.yml 的差別：使用 GitHub Actions 建好的映像檔、不掛載原始碼、資料庫與 API 不開連接埠、
# 只有 nginx 對外開 HTTPS_PORT（預設 8443；443 已由預約簿使用，Cloudflare 以 Origin Rule 轉到這個連接埠）。
name: bigtours

x-app: &app
  image: ${APP_IMAGE:?請在 .env 設定 APP_IMAGE（deploy.sh 會自動寫入）}
  restart: unless-stopped
  environment:
    NODE_ENV: production
    DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}@postgres:5432/bigtours
    DATABASE_URL: postgres://bigtours_app:${DB_APP_PASSWORD:?請在 .env 設定 DB_APP_PASSWORD}@postgres:5432/bigtours
    PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?請在 .env 設定 PLATFORM_DOMAIN}
    API_PORT: "4000"
    API_URL: http://api:4000
    DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?請在 .env 設定 DATA_ENCRYPTION_KEY}
    TOKEN_HASH_KEY: ${TOKEN_HASH_KEY:?請在 .env 設定 TOKEN_HASH_KEY}
    WEB_BASE_URL: https://${PLATFORM_DOMAIN}/{agency}
    STORAGE_DIR: /data/storage
    SMTP_URL: ${SMTP_URL:?請在 .env 設定 SMTP_URL}
    MAIL_FROM: ${MAIL_FROM:?請在 .env 設定 MAIL_FROM}
    TRIAL_NOTIFY_EMAIL: ${TRIAL_NOTIFY_EMAIL:-}
    DEMO_ENABLED: ${DEMO_ENABLED:-true}
    SITE_LINE_URL: ${SITE_LINE_URL:-}
    SITE_SIBLING_URL: ${SITE_SIBLING_URL:-https://bookdex.cc}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
      POSTGRES_DB: bigtours
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bigtours"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # 每次部署先跑資料庫遷移，完成後結束；API 等它成功才啟動
  migrate:
    <<: *app
    restart: "no"
    working_dir: /app
    command: ["node_modules/.bin/tsx", "db/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    working_dir: /app/apps/api
    command: ["node_modules/.bin/tsx", "src/main.ts"]
    volumes: [storage-data:/data/storage]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    <<: *app
    working_dir: /app/apps/web
    command: ["node_modules/.bin/next", "start", "-H", "0.0.0.0", "-p", "3000"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${HTTPS_PORT:-8443}:443"]
    volumes:
      - ./deploy/lightsail/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/lightsail/certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

volumes:
  postgres-data:
  storage-data:
