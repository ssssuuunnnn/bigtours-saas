# 正式環境 nginx：docker-compose.prod.yml 掛載成 /etc/nginx/conf.d/default.conf。
# 只有 Cloudflare 連得進來（SSL/TLS 模式 Full (strict)，Origin Rule 把 tours 網域轉到主機的 8443）。
# 憑證是 Cloudflare Origin Certificate（tours.bookdex.cc 與 *.tours.bookdex.cc），放在主機的
# /opt/bigtours/deploy/lightsail/certs/origin.pem、origin.key，不進 git。
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 用 CF-Connecting-IP 還原訪客 IP；只信任 Cloudflare 的位址
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # 活動條款 PDF、圖片上傳最大 10MB
    client_max_body_size 12m;

    # 旅行社由網址判定，Host 原樣交給後端；X-Forwarded-For 只放還原後的訪客 IP，
    # 不沿用請求帶來的值，避免有人偽造來源繞過限流
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;

    location /api/ {
        proxy_pass http://api:4000;
    }

    location / {
        proxy_pass http://web:3000;
    }
}
