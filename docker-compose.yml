# 本機開發環境：docker compose up --build
# 以下密碼與金鑰都只供本機使用，不可用於正式環境。

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: bigtours-dev
  environment: &app-env
    DATABASE_ADMIN_URL: postgres://postgres:postgres@postgres:5432/bigtours
    DATABASE_URL: postgres://bigtours_app:bigtours_app@postgres:5432/bigtours
    # 平台網址；旅行社在 平台網址/{代號}/...
    PLATFORM_DOMAIN: localhost:3000
    API_PORT: "4000"
    API_URL: http://api:4000
    DATA_ENCRYPTION_KEY: ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZCE=
    TOKEN_HASH_KEY: dev-only-token-hash-key
    WEB_BASE_URL: http://localhost:3000/{agency}
    STORAGE_DIR: /data/storage
    SMTP_URL: smtp://mailpit:1025
    MAIL_FROM: no-reply@bigtours.example
    # 官網試用申請的通知信收件人，以及是否啟用公開試玩（平台網址/try）
    TRIAL_NOTIFY_EMAIL: platform@bigtours.example
    DEMO_ENABLED: "true"
    # 試用到期提醒與到期後刪除（每小時檢查）
    TRIAL_JOBS_ENABLED: "true"
    # 官網的 LINE 官方帳號網址，留空時不顯示 LINE 按鈕
    SITE_LINE_URL: ""

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bigtours
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bigtours"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 建立資料表，第一次啟動時加入示範資料，完成後結束
  migrate:
    <<: *app
    command: sh -c "pnpm exec tsx db/migrate.ts && SEED_ONLY_IF_EMPTY=1 pnpm exec tsx db/seed.ts"
    volumes:
      - storage-data:/data/storage
      - ./db:/app/db
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: pnpm --filter @bigtours/api exec tsx watch src/main.ts
    ports: ["4000:4000"]
    volumes:
      - storage-data:/data/storage
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/test:/app/apps/api/test
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    <<: *app
    command: pnpm --filter @bigtours/web dev
    ports: ["3000:3000"]
    volumes:
      - ./apps/web/app:/app/apps/web/app
      - ./apps/web/lib:/app/apps/web/lib
      - ./apps/web/messages:/app/apps/web/messages
      - ./apps/web/next.config.ts:/app/apps/web/next.config.ts
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  storage-data:
  postgres-data:
